# Thumbnail Grabber — TrueNAS SCALE deployment
#
# Paste into Apps -> Discover Apps -> Custom App -> Install via YAML, or run with
# `docker compose up -d` from a shell on the NAS.
#
# Datasets are mounted at the same path they have on the host, so a folder is
# called the same thing in the picker, in the TrueNAS UI and over SMB. Any folder
# inside a mounted dataset can be chosen from the UI without redeploying.
#
# ---------------------------------------------------------------------------
# THE PATH IS CASE SENSITIVE. The pool is "Main", so it is /mnt/Main and not
# /mnt/main. Docker does not complain about a host path that does not exist: it
# creates an empty directory and mounts that, so the app writes happily to the
# system drive while the pool stays empty and the shares show nothing.
#
# ADDING A SHARE AS A DESTINATION — two edits, and they must agree:
#   1. a line under `volumes`, as  /host/path:/host/path  (same both sides)
#   2. that same path appended to TG_OUTPUT_ROOTS, colon-separated
#
# Mount the DATASET, not the pool root. A bind mount is not recursive, so
# mounting /mnt/Main carries that dataset alone and every child dataset arrives as
# the bare empty directory its mountpoint sits on.
#
# Paths containing spaces must be quoted, as below.
# ---------------------------------------------------------------------------

services:
  thumbnail-grabber:
    image: ghcr.io/reckertiii/thumbnailgrabber:latest
    container_name: thumbnail-grabber
    restart: unless-stopped

    # "always" would re-pull on every restart, which needs a registry credential
    # once the repo is private. This is the equivalent of IfNotPresent.
    pull_policy: missing

    ports:
      # host:container. The container side is fixed at 8000 — that is what the app
      # binds. Change only the left number, and TrueNAS wants it at 9000 or above.
      - "9080:8000"

    volumes:
      - "/mnt/Main/apps:/mnt/Main/apps"
      - "/mnt/Main/Grace Shared:/mnt/Main/Grace Shared"
      - "/mnt/Main/Grace Central Services:/mnt/Main/Grace Central Services"
      - "/mnt/Main/Grace Cortland:/mnt/Main/Grace Cortland"
      - "/mnt/Main/Grace Dryden:/mnt/Main/Grace Dryden"

      # The rest of the pool, if you ever want them as destinations. Uncomment
      # and add the same path to TG_OUTPUT_ROOTS.
      # - "/mnt/Main/FinalCut:/mnt/Main/FinalCut"
      # - "/mnt/Main/Backups:/mnt/Main/Backups"
      # - "/mnt/Main/Companion:/mnt/Main/Companion"
      # - "/mnt/Main/CompanionModules:/mnt/Main/CompanionModules"
      # - "/mnt/Main/QLC:/mnt/Main/QLC"

    # Run as the user that owns these folders, NOT root. The PNGs are reached over
    # SMB from Windows and Mac, and a root-owned 0644 file can be opened but not
    # deleted or renamed — deleting needs write on the parent directory. Find the
    # numbers with:   ls -ln "/mnt/Main/apps" | head
    # then uncomment. Left commented it runs as root, which works but leaves files
    # you cannot tidy up from a Mac or PC.
    # user: "3000:3000"

    environment:
      # --- where things go ----------------------------------------------------
      TG_OUTPUT_DIR: "/mnt/Main/apps/capture"

      # How far the folder picker may browse. Colon-separated; every entry needs a
      # matching volume above, or the picker offers a folder it cannot reach.
      TG_OUTPUT_ROOTS: "/mnt/Main/apps:/mnt/Main/Grace Shared:/mnt/Main/Grace Central Services:/mnt/Main/Grace Cortland:/mnt/Main/Grace Dryden"

      # Directories the video scanner may read. Same rule.
      TG_VIDEO_ROOTS: "/mnt/Main/apps:/mnt/Main/Grace Shared:/mnt/Main/Grace Central Services:/mnt/Main/Grace Cortland:/mnt/Main/Grace Dryden"

      # The saved camera and your star/reject ratings. Must be on a mount, or you
      # re-enter the camera after every update.
      TG_DATA_DIR: "/mnt/Main/apps/tg-models"

      TG_MAX_UPLOAD_MB: "4096"

      # --- camera -------------------------------------------------------------
      # First-run default only, and not needed: connect the camera in the UI and
      # it is saved to TG_DATA_DIR and used from then on. Leaving this empty keeps
      # the camera password out of the app config.
      TG_STREAM_SOURCE: ""

      TZ: "America/New_York"          # capture filenames use local time
      # The uid above has no passwd entry when user: is set, so give it a home.
      HOME: "/tmp"

      # --- AI judge, via the Ollama app on this same NAS -----------------------
      # Use the NAS's LAN IP, never localhost: inside a container that is the
      # container itself. Check the port with: curl http://<nas-ip>:<port>/api/tags
      OLLAMA_HOST: "http://192.168.32.104:30068"
      TG_AI_JUDGE_BACKEND: "ollama"
      TG_AI_JUDGE_OLLAMA_MODEL: "qwen3-vl:30b"
      # Must match the CPU limit on the Ollama app. Left at 0, Ollama spawns one
      # thread per host core, overruns its quota and is throttled — about 3x slower.
      TG_AI_JUDGE_OLLAMA_NUM_THREAD: "20"
      # The judge stops reviewing this long after startup and releases the model.
      # Press Wake in the UI to re-arm it and load it again.
      TG_AI_JUDGE_ACTIVE_HOURS: "2"

    # The frame buffer is the largest single allocation and is adjustable from the
    # UI, so the limit needs headroom above whatever you set it to. 5s at 1080p is
    # ~0.9 GB; 20s is ~3.5 GB, which does not fit in 4G alongside everything else.
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
