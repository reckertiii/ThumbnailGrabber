# Thumbnail Grabber — TrueNAS SCALE deployment
#
# Paste into Apps -> Discover Apps -> Custom App -> Install via YAML, or run with
# `docker compose up -d` from a shell on the NAS.
#
# Datasets are mounted at the same path they have on the host, so a folder is
# called the same thing in the picker, in the TrueNAS UI and over SMB. Any
# folder inside a mounted dataset can be chosen without redeploying.
#
# Change before deploying:
#   1. /mnt/main/apps -> the dataset(s) you want reachable
#   2. user:          -> see the note on it below
#   3. OLLAMA_HOST    -> your NAS IP and the Ollama app's actual port
#
# The UI is then at http://<nas-ip>:9080

services:
  thumbnail-grabber:
    image: ghcr.io/reckertiii/thumbnailgrabber:latest
    container_name: thumbnail-grabber
    restart: unless-stopped

    # "always" would re-pull on every restart, which needs a registry credential
    # once the repo is private. This is the equivalent of IfNotPresent.
    pull_policy: missing

    ports:
      # host:container. The container side is fixed at 8000 — that is what the app
      # binds. Change only the left number, and TrueNAS wants it at 9000 or above.
      - "9080:8000"

    volumes:
      # Mount the DATASET, not the pool root.
      #
      # A bind mount is not recursive, so mounting /mnt/main carries the `main`
      # dataset alone. Every child dataset -- `apps` is one -- comes through as
      # the bare empty directory its mountpoint sits on. The app then happily
      # creates its folders inside that empty directory, where the host has the
      # real dataset mounted over the top, and the captures are invisible over
      # SMB while the app insists they exist.
      #
      # So list each dataset you want reachable, at its own path. Check which
      # paths are datasets with:  zfs list -o name,mountpoint
      - /mnt/main/apps:/mnt/main/apps
      # Add more the same way, and extend TG_OUTPUT_ROOTS to match:
      # - /mnt/main/media:/mnt/main/media

    # Run as the user that owns these folders, NOT root. The PNGs are reached over
    # SMB from Windows and Mac, and a root-owned 0644 file can be opened but not
    # deleted or renamed — deleting needs write on the parent directory. This
    # dataset already has files in it, so match what is there:
    #     ls -ln /mnt/main/apps/capture | head     (shows the numeric uid and gid)
    # then uncomment and set both numbers. Left commented it runs as root, which
    # works but leaves files you cannot tidy up from a Mac or PC.
    # user: "3000:3000"

    environment:
      # --- where things go ----------------------------------------------------
      # Real paths, because the mount above mirrors them. These must agree with
      # the mount or captures land in the container's own throwaway layer.
      TG_OUTPUT_DIR: "/mnt/main/apps/capture"
      # The folder picker may browse anywhere under here. Colon-separated for
      # several. Narrow it to /mnt/main/apps to keep the rest of the pool out of
      # reach — the web UI has no authentication.
      TG_OUTPUT_ROOTS: "/mnt/main/apps"
      # Where the saved camera and your star/reject ratings live. Under the mount,
      # so it survives the app being recreated. Without this they sit in the
      # container and you re-enter the camera after every update.
      TG_DATA_DIR: "/mnt/main/apps/tg-models"
      # Directories the video scanner may read.
      TG_VIDEO_ROOTS: "/mnt/main/apps"
      TG_MAX_UPLOAD_MB: "4096"

      # --- camera -------------------------------------------------------------
      # First-run default only, and not needed: connect the camera in the UI and
      # it is saved to TG_DATA_DIR and used from then on. Leaving this empty keeps
      # the camera password out of the app config.
      TG_STREAM_SOURCE: ""

      TZ: "America/New_York"          # capture filenames use local time
      # The uid above has no passwd entry when user: is set, so give it a home.
      HOME: "/tmp"

      # --- AI judge, via the Ollama app on this same NAS -----------------------
      # Use the NAS's LAN IP, never localhost: inside a container that is the
      # container itself. The catalog Ollama app usually remaps 11434 to a
      # 30000-range port — check with: curl http://<nas-ip>:<port>/api/tags
      OLLAMA_HOST: "http://192.168.32.104:30068"
      TG_AI_JUDGE_BACKEND: "ollama"
      TG_AI_JUDGE_OLLAMA_MODEL: "qwen3-vl:30b"
      # Must match the CPU limit on the Ollama app. Left at 0, Ollama spawns one
      # thread per host core, overruns its quota and is throttled — about 3x slower.
      TG_AI_JUDGE_OLLAMA_NUM_THREAD: "20"
      # The judge stops reviewing this long after startup and unloads the model,
      # releasing ~20 GB. Press Wake in the UI to re-arm it and load it again.
      TG_AI_JUDGE_ACTIVE_HOURS: "2"

    # The frame buffer is the largest allocation — about 0.9 GB at the 5s default,
    # and it is adjustable from the UI, so leave headroom above what you plan to use.
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
