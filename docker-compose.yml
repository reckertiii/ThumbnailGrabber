services:
  thumbnail-grabber:
    container_name: thumbnail-grabber
    build:
      context: .
      dockerfile: Dockerfile
    image: thumbnail-grabber:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TG_OUTPUT_DIR=/app/captures
      - TG_STREAM_SOURCE=${TG_STREAM_SOURCE:-0}
    volumes:
      - ./captures:/app/captures
      - ./models:/app/models
    restart: unless-stopped
