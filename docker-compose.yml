services:
  thumbnail-grabber:
    container_name: thumbnail-grabber
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/reckertiii/thumbnailgrabber:latest
    ports:
      - "8000:8000"
    environment:
      - TG_STREAM_SOURCE=${TG_STREAM_SOURCE:-0}
      - TG_OUTPUT_DIR=/app/captures
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./captures:/app/captures
      - ./models:/app/models
    restart: unless-stopped
